name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/configurable-rest-pose
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm

      - name: Apply rest pose implementation
        run: python3 tools/apply-rest-pose.py

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:types
      - run: npm run verify:api
      - run: npm run test:unit
      - run: npm run verify:three
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum npx playwright test --project=chromium

      - name: Record verification and push result
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          report = {
              "status": "PASS",
              "scope": "configurable-rest-pose",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "checks": [
                  {"id": "typecheck", "status": "PASS"},
                  {"id": "build", "status": "PASS"},
                  {"id": "declarations", "status": "PASS"},
                  {"id": "public-api", "status": "PASS"},
                  {"id": "unit", "status": "PASS"},
                  {"id": "single-three", "status": "PASS"},
                  {"id": "e2e-chromium", "status": "PASS"}
              ]
          }
          with open("validation-report.json", "w", encoding="utf-8") as file:
              json.dump(report, file, ensure_ascii=False, indent=2)
              file.write("\n")
          PY

          rm -f tools/apply-rest-pose.py .github/workflows/rest-pose.yml docs/.keep-rest-pose-pr
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            pull_request:

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24.18.1
                    cache: npm
                - run: npm ci
                - run: npm run typecheck
                - run: npm run build
                - run: npm run build:types
                - run: npm run verify:api
                - run: npm run test:unit
                - run: npm run verify:three
                - run: npx playwright install --with-deps chromium firefox webkit
                - run: xvfb-run --auto-servernum npm run test:e2e
          YAML

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add configurable animation-end rest pose"
          git push origin HEAD:agent/configurable-rest-pose
