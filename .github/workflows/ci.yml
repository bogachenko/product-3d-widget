name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply pending PBR implementation
        if: ${{ hashFiles('scripts/apply-pbr-texture-variants.mjs') != '' }}
        run: |
          node scripts/apply-pbr-texture-variants.mjs
          rm scripts/apply-pbr-texture-variants.mjs
          rm -f .github/workflows/inspect-pbr-implementation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add PBR textures to color variants'
          git push origin HEAD:${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:types
      - run: npm run verify:api
      - run: npm run test:unit
      - run: npm run verify:three
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: xvfb-run --auto-servernum npm run test:e2e