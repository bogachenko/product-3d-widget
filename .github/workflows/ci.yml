name: CI

on:
  push:
    branches: [main, agent/implement-product-3d-widget]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
      - run: npm install
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify
