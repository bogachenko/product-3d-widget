name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/configurable-rest-pose
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm

      - name: Apply approved GRACE propagation
        run: python3 tools/apply-rest-pose-grace.py

      - name: Validate XML artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          files = [
              "RequirementsAnalysis.xml",
              "DevelopmentPlan.xml",
              "ModuleContracts.xml",
              "ClassFunctionContracts.xml",
          ]
          for name in files:
              ElementTree.parse(name)
              text = Path(name).read_text()
              assert "CONFIGURABLE-REST-POSE" in text, name
          assert "ENTITY-ORDINARY-POSE" in Path("RequirementsAnalysis.xml").read_text()
          assert "CFC-TYPE-REST-POSE-CONFIG" in Path("ClassFunctionContracts.xml").read_text()
          print("PASS rest pose GRACE artifacts are well-formed and linked")
          PY

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

      - name: Commit approved artifacts
        run: |
          rm tools/apply-rest-pose-grace.py
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            pull_request:

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24.18.1
                    cache: npm
                - run: npm ci
                - run: npm run typecheck
                - run: npm run build
                - run: npm run build:types
                - run: npm run verify:api
                - run: npm run test:unit
                - run: npm run verify:three
                - run: npx playwright install --with-deps chromium firefox webkit
                - run: xvfb-run --auto-servernum npm run test:e2e
          YAML

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Propagate configurable rest pose contracts"
          git push origin HEAD:agent/configurable-rest-pose
