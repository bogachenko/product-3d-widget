name: Bootstrap implementation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/implement-product-3d-widget
          fetch-depth: 0
      - name: Apply implementation archive
        shell: bash
        run: |
          cat .bootstrap-project/part-* | base64 --decode > /tmp/product-3d-widget.tar.gz
          echo 'c0b6b4769af7f0c1b788dfff3458ac6e69d08c03e7757d52acb07b6d993af6ae  /tmp/product-3d-widget.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/product-3d-widget.tar.gz
          rm -rf .bootstrap-project .github/workflows/bootstrap.yml
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Implement product-3d-widget contracts'
          git push origin HEAD:agent/implement-product-3d-widget
