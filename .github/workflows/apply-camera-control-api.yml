name: Apply camera control API

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/public-camera-control-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/public-camera-control-api
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm

      - name: Apply approved GRACE and implementation patch
        run: python3 tools/apply-camera-control-api.py

      - name: Validate GRACE artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          artifacts = [
              'RequirementsAnalysis.xml',
              'Technology.xml',
              'DevelopmentPlan.xml',
              'ModuleContracts.xml',
              'ClassFunctionContracts.xml',
          ]
          for artifact in artifacts:
              ElementTree.parse(artifact)

          required = {
              'RequirementsAnalysis.xml': [
                  'FR-CAMERA-VIEW-CONFIGURATION',
                  'FR-CAMERA-PUBLIC-CONTROLS',
                  'FR-CAMERA-MULTI-NODE-FOCUS',
                  'FR-CAMERA-RESTORE-AND-CANCEL',
                  'FR-CAMERA-TRANSITION-ISOLATION',
              ],
              'DevelopmentPlan.xml': ['FR-CAMERA-PUBLIC-CONTROLS', 'FR-CAMERA-TRANSITION-ISOLATION'],
              'ModuleContracts.xml': ['FR-CAMERA-PUBLIC-CONTROLS', 'MC-IN-VIEWER-CAMERA', 'MC-OUT-VIEWER-CAMERA'],
              'ClassFunctionContracts.xml': [
                  'CFC-FN-WIDGET-SET-CAMERA-VIEW',
                  'CFC-FN-WIDGET-FOCUS-NODE',
                  'CFC-FN-WIDGET-FOCUS-NODES',
                  'CFC-FN-WIDGET-RESTORE-CAMERA-VIEW',
                  'CFC-FN-WIDGET-CANCEL-CAMERA-TRANSITION',
              ],
          }
          for artifact, identifiers in required.items():
              text = Path(artifact).read_text(encoding='utf-8')
              missing = [identifier for identifier in identifiers if identifier not in text]
              if missing:
                  raise SystemExit(f'{artifact}: missing {missing}')
          PY

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:types
      - run: npm run verify:api
      - run: npm run test:unit
      - run: npm run verify:three
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum npx playwright test tests/camera-control.spec.ts tests/rest-pose.spec.ts --project=chromium
      - run: git diff --check

      - name: Record result and commit verified implementation
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone

          report = {
              'status': 'PASS',
              'scope': 'public-camera-control-api',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'checks': [
                  {'id': 'requirements-propagation', 'status': 'PASS'},
                  {'id': 'architecture-propagation', 'status': 'PASS'},
                  {'id': 'module-contract-propagation', 'status': 'PASS'},
                  {'id': 'class-function-contract-propagation', 'status': 'PASS'},
                  {'id': 'xml-well-formed', 'status': 'PASS'},
                  {'id': 'typecheck', 'status': 'PASS'},
                  {'id': 'build', 'status': 'PASS'},
                  {'id': 'declarations', 'status': 'PASS'},
                  {'id': 'public-api', 'status': 'PASS'},
                  {'id': 'unit', 'status': 'PASS'},
                  {'id': 'single-three', 'status': 'PASS'},
                  {'id': 'camera-e2e-chromium', 'status': 'PASS'},
                  {'id': 'rest-pose-regression-chromium', 'status': 'PASS'},
              ],
          }
          with open('validation-report.json', 'w', encoding='utf-8') as file:
              json.dump(report, file, ensure_ascii=False, indent=2)
              file.write('\n')
          PY

          rm -f tools/apply-camera-control-api.py .github/workflows/apply-camera-control-api.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add public camera control API"
          git push origin HEAD:agent/public-camera-control-api
