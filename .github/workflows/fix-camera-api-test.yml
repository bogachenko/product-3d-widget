name: Update camera API browser assertion

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-test:
    if: github.head_ref == 'agent/public-camera-control-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/public-camera-control-api
          fetch-depth: 0

      - name: Update exact method list
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/product-3d-widget.spec.ts')
          text = path.read_text(encoding='utf-8')
          old = '''  expect(before.prototypeMethods).toEqual([
              'configure',
              'getState',
              'launchAR',
              'nextScenarioStep',
              'playAnimation',
              'previousScenarioStep',
              'selectColor',
              'selectVariant',
              'startScenario',
              'stopScenario',
            ]);'''
          new = '''  expect(before.prototypeMethods).toEqual([
              'cancelCameraTransition',
              'configure',
              'focusOnNode',
              'focusOnNodes',
              'getState',
              'launchAR',
              'nextScenarioStep',
              'playAnimation',
              'previousScenarioStep',
              'restoreCameraView',
              'selectColor',
              'selectVariant',
              'setCameraView',
              'startScenario',
              'stopScenario',
            ]);'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one exact API assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit correction
        run: |
          rm .github/workflows/fix-camera-api-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/product-3d-widget.spec.ts .github/workflows/fix-camera-api-test.yml
          git commit -m "Update exact public camera API assertion"
          git push origin HEAD:agent/public-camera-control-api
