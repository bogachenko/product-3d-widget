name: Run scenario camera implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/scenario-camera-view'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scenario-camera-view
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - name: Apply approved change
        run: |
          python <<'EXTRACT'
          from pathlib import Path
          from textwrap import dedent
          workflow = Path('.github/workflows/agent-scenario-camera-view.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n      - run: npm ci"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = dedent(workflow[start:end])
          exec(compile(script, 'scenario-camera-view-patch.py', 'exec'))
          EXTRACT
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:types
      - run: npm run verify:api
      - run: npm run test:unit
      - run: npm run verify:three
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: xvfb-run --auto-servernum npm run test:e2e
      - name: Record verified result
        run: |
          python <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path
          for path in ('RequirementsAnalysis.xml', 'Technology.xml', 'DevelopmentPlan.xml', 'ModuleContracts.xml', 'ClassFunctionContracts.xml'):
              ET.parse(path)
          report = {
              'status': 'PASS',
              'scope': 'scenario-camera-view',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'checks': [
                  {'id': 'requirements-propagation', 'status': 'PASS'},
                  {'id': 'xml-well-formed', 'status': 'PASS'},
                  {'id': 'typecheck', 'status': 'PASS'},
                  {'id': 'production-build', 'status': 'PASS'},
                  {'id': 'declarations', 'status': 'PASS'},
                  {'id': 'public-api', 'status': 'PASS'},
                  {'id': 'unit-tests', 'status': 'PASS'},
                  {'id': 'scenario-camera-e2e', 'status': 'PASS'},
                  {'id': 'full-playwright-matrix', 'status': 'PASS'},
                  {'id': 'single-three', 'status': 'PASS'},
              ],
          }
          Path('validation-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          PY
          rm .github/workflows/agent-scenario-camera-view.yml
          rm .github/workflows/agent-scenario-camera-view-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add automatic scenario camera views [skip ci]'
          git push origin HEAD:agent/scenario-camera-view
