name: Apply color geometry and UV channel

on:
  push:
    branches:
      - agent/color-geometry-uv-channel

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/color-geometry-uv-channel
      - name: Apply patch and commit result
        run: |
          set +e
          node scripts/apply-color-geometry-uv.mjs > color-geometry-uv-apply.log 2>&1
          status=$?
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/apply-color-geometry-uv.yml
          if [ "$status" -eq 0 ]; then
            rm scripts/apply-color-geometry-uv.mjs
            rm color-geometry-uv-apply.log
            git add -A
            git commit -m 'Добавить геометрию цвета и выбор UV-канала'
            git push origin HEAD:agent/color-geometry-uv-channel
            exit 0
          fi
          git add -A
          git commit -m 'Зафиксировать ошибку применения геометрии цвета и UV-канала'
          git push origin HEAD:agent/color-geometry-uv-channel
          exit "$status"
