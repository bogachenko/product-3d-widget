name: Inspect surface implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - name: Show model-viewer material texture types
        run: |
          grep -RIn -C 12 "interface TextureInfo\|interface Texture\|createTexture(uri\|class ModelViewerElement" node_modules/@google/model-viewer/lib node_modules/@google/model-viewer/src 2>/dev/null | head -1200 || true
