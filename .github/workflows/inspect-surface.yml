name: Implement surface textures

on:
  push:
    branches:
      - agent/surface-texture-variants
  pull_request:
    branches:
      - main

concurrency:
  group: surface-texture-implementation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/surface-texture-variants
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - name: Apply implementation
        run: python3 scripts/implement-surface-textures.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:types
      - run: npm run verify:api
      - run: npm run test:unit
      - run: npm run verify:three
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: xvfb-run --auto-servernum npm run test:e2e
      - name: Update validation report
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          report = {
            'status': 'PASS',
            'scope': 'color-surface-textures',
            'generated_at': datetime.now(timezone.utc).isoformat(),
            'checks': [
              {'id': 'requirements-propagation', 'status': 'PASS'},
              {'id': 'xml-well-formed', 'status': 'PASS'},
              {'id': 'typecheck', 'status': 'PASS'},
              {'id': 'production-build', 'status': 'PASS'},
              {'id': 'declarations', 'status': 'PASS'},
              {'id': 'public-api', 'status': 'PASS'},
              {'id': 'unit-tests', 'status': 'PASS'},
              {'id': 'surface-texture-e2e', 'status': 'PASS'},
              {'id': 'full-playwright-matrix', 'status': 'PASS'},
              {'id': 'single-three', 'status': 'PASS'},
            ],
          }
          Path('validation-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Remove temporary implementation files
        run: rm scripts/implement-surface-textures.py .github/workflows/inspect-surface.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Support PBR surface textures in color variants'
          git push origin HEAD:agent/surface-texture-variants
