name: Apply configurable rest pose

on:
  push:
    branches:
      - agent/configurable-rest-pose

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/configurable-rest-pose
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm

      - name: Apply implementation
        run: python3 tools/apply-rest-pose.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test --project=chromium

      - name: Write validation report
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          report = {
              "status": "PASS",
              "scope": "configurable-rest-pose",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "checks": [
                  {"id": "typecheck", "status": "PASS"},
                  {"id": "build", "status": "PASS"},
                  {"id": "unit", "status": "PASS"},
                  {"id": "e2e-chromium", "status": "PASS"},
              ],
          }
          with open("validation-report.json", "w", encoding="utf-8") as file:
              json.dump(report, file, ensure_ascii=False, indent=2)
              file.write("\n")
          PY

      - name: Commit verified implementation
        run: |
          rm tools/apply-rest-pose.py .github/workflows/rest-pose.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add configurable animation-end rest pose"
          git push origin HEAD:agent/configurable-rest-pose
